name: videoapp-prod

services:
  # Entry point: client container (nginx) serves the built SPA + reverse-proxies API/WS
  client:
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../apps/client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      gateway-service:
        condition: service_healthy
      signaling-service:
        condition: service_healthy
    restart: unless-stopped

  gateway-service:
    build:
      context: ..
      dockerfile: apps/gateway-service/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: videoapp_gateway
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      ROOM_SERVICE_HOST: room-service
      ROOM_SERVICE_PORT: "50051"
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_URL: ${TURN_URL}
      TURN_TLS_URL: ${TURN_TLS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-${DOMAIN_PROTOCOL}://${DOMAIN}}
    depends_on:
      postgres:
        condition: service_healthy
      room-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  room-service:
    build:
      context: ..
      dockerfile: apps/room-service/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: videoapp_room
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(50051, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  signaling-service:
    build:
      context: ..
      dockerfile: apps/signaling-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3002"
      JWT_SECRET: ${JWT_SECRET}
      ROOM_SERVICE_HOST: room-service
      ROOM_SERVICE_PORT: "50051"
    depends_on:
      room-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # TURN/STUN relay (coturn). host network: relay range 49152-65535 через userland-proxy
  # не пробрасывается, поэтому контейнер использует сеть хоста напрямую.
  coturn:
    image: coturn/coturn:latest
    network_mode: host
    user: "0:0"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - certs:/etc/letsencrypt:ro
    restart: unless-stopped

  # One-shot: issue/renew Let's Encrypt cert. Run on demand:
  #   docker compose --profile certs run --rm certbot
  certbot:
    image: certbot/certbot
    profiles: ["certs"]
    volumes:
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot -d ${DOMAIN} -d www.${DOMAIN} --agree-tos --email ${LETSENCRYPT_EMAIL} --no-eff-email

volumes:
  postgres_data:
  certs:
  certbot_www: