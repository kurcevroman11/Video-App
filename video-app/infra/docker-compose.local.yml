# Local test override: no TLS, expose client (nginx) on 8080, use TLS-less config
services:
  client:
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ../apps/client/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-service
      - signaling-service