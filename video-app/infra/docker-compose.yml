version: '3.8'

services:
  gateway-service:
    build: ./apps/gateway-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - ROOM_SERVICE_URL=room-service:3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - room-service
      - redis

  room-service:
    build: ./apps/room-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/videoapp
    depends_on:
      - postgres

  signaling-service:
    build: ./apps/signaling-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  media-service:
    build: ./apps/media-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development

  client:
    build: ./apps/client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_SIGNALING_URL=ws://localhost:3002

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=videoapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
