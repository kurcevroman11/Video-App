listening-port=3478
tls-listening-port=5349

# диапазон портов для релея медиатрафика
min-port=49152
max-port=65535

# публичный IP сервера (заменить на реальный при развёртывании)
# для локальной разработки используем localhost
external-ip=127.0.0.1

realm=video-app
use-auth-secret
# временные credentials (RFC draft-uberti-behave-turn-rest): client credential = base64(HMAC-SHA1(secret, "<expiry>:<userId>"))
# coturn сам валидирует HMAC при подключении, без обращения к БД.
# ВАЖНО: coturn НЕ делает подстановку переменных окружения в конфиге — секрет задаётся напрямую.
# Значение ниже — ТОЛЬКО для разработки. Заменить на TURN_SHARED_SECRET из gateway-service .env при прод-развёртывании.
static-auth-secret=6305bd604973ccaff6544d6079b5d00e86e4321688d5d0997e4c52d089755c3b

fingerprint
lt-cred-mech

# защита от использования сервера как открытого relay во внутреннюю сеть (RFC-стандартная рекомендация)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

no-cli
no-tcp-relay

verbose
