listening-port=3478
# TLS отключён локально (нет LE-сертификатов). Вернуть для прода:
# tls-listening-port=5349

# диапазон портов для релея медиатрафика
min-port=49152
max-port=65535

# публичный IP сервера (1:1 NAT у хостинга — указываем явно)
external-ip=159.194.239.54

# TLS-сертификаты из Let's Encrypt (монтируются из volume videoapp-prod_certs)
# cert=/etc/letsencrypt/live/rkvideoapp.ru/fullchain.pem
# pkey=/etc/letsencrypt/live/rkvideoapp.ru/privkey.pem

realm=rkvideoapp.ru
use-auth-secret
# ВАЖНО: секрет НЕ хранится в git. Подставляется при деплое из infra/.env (TURN_SHARED_SECRET).
# Локально: = TURN_SHARED_SECRET из apps/gateway-service/.env (должен совпадать с gateway).
static-auth-secret=6305bd604973ccaff6544d6079b5d00e86e4321688d5d0997e4c52d089755c3b

fingerprint
lt-cred-mech

# защита от использования сервера как открытого relay во внутреннюю сеть (RFC-стандартная рекомендация)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

no-cli
no-tcp-relay

verbose
